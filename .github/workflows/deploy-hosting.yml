name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOSTING_PROTOCOL: ${{ vars.HOSTING_PROTOCOL || 'sftp' }}
      HOSTING_HOST: ${{ vars.HOSTING_HOST }}
      HOSTING_USER: ${{ vars.HOSTING_USER }}
      HOSTING_DIR: ${{ vars.HOSTING_DIR || 'vityungr/public_html' }}
      HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
      # форма заявки /order → Telegram и почта (public/api/order.php)
      ORDER_TELEGRAM_TOKEN: ${{ secrets.ORDER_TELEGRAM_TOKEN }}
      ORDER_TELEGRAM_CHAT: ${{ secrets.ORDER_TELEGRAM_CHAT }}
      ORDER_EMAIL: ${{ vars.ORDER_EMAIL }}
      ORDER_MAIL_FROM: ${{ vars.ORDER_MAIL_FROM }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -qq lftp
      - run: bash .github/deploy-hosting.sh --upload
